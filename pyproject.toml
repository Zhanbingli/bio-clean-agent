[project]
name = "bio-clean-agent"
version = "0.1.0"
description = "AI-assisted pipelines for sequencing, transcriptomics, and metabolomics data cleaning"
authors = [{name = "Researcher"}]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "typer>=0.9",
    "rich>=13.0",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
seq = ["biopython>=1.81"]
openai = ["openai>=1.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
bio-clean-agent = "bio_clean_agent.cli:app"
