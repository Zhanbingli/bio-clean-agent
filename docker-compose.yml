version: '3.8'

services:
  web:
    build: .
    container_name: bio-clean-agent-web
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-104857600}  # 100MB
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add a development service with hot-reload
  dev:
    build: .
    container_name: bio-clean-agent-dev
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=DEBUG
    command: ["python", "-m", "uvicorn", "bio_clean_agent.web.app:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    profiles:
      - dev

volumes:
  data:
  outputs:
  logs:
