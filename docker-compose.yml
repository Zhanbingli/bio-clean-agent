version: '3.8'

services:
  # Web应用
  web:
    build: .
    container_name: bio-clean-web
    ports:
      - "8080:8080"
    environment:
      # 安全配置
      - ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
      - PHI_HASH_SALT=${PHI_HASH_SALT:-changeme_generate_secure_salt}
      - MAX_FILE_SIZE_MB=100

      # 数据库配置
      - DATABASE_URL=postgresql://bioclean:bioclean@db:5432/bioclean

      # Redis配置
      - REDIS_URL=redis://redis:6379/0

      # 日志配置
      - LOG_LEVEL=INFO
      - ENABLE_AUDIT_LOGGING=true

      # OpenAI配置 (可选)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

    volumes:
      # 数据持久化
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./reports:/app/reports
      - ./logs:/app/logs
      # 上传文件临时存储
      - uploads:/app/uploads

    depends_on:
      - db
      - redis

    networks:
      - bio-clean-network

    restart: unless-stopped

  # PostgreSQL数据库
  db:
    image: postgres:15-alpine
    container_name: bio-clean-db
    environment:
      - POSTGRES_DB=bioclean
      - POSTGRES_USER=bioclean
      - POSTGRES_PASSWORD=bioclean
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql

    ports:
      - "5432:5432"

    networks:
      - bio-clean-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioclean"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存和任务队列
  redis:
    image: redis:7-alpine
    container_name: bio-clean-redis
    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - bio-clean-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx反向代理 (可选，用于生产环境)
  nginx:
    image: nginx:alpine
    container_name: bio-clean-nginx
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - web

    networks:
      - bio-clean-network

    restart: unless-stopped

    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local

networks:
  bio-clean-network:
    driver: bridge
